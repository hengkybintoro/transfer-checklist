name: CI

# Jalan di GitHub-hosted runner: hanya build & test (bukan untuk menjalankan web).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          test -z "$(gofmt -l .)" || { echo "File belum di-gofmt:"; gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w" -o dist/transfer-checklist-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/server
      - uses: actions/upload-artifact@v4
        with:
          name: transfer-checklist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 14
